    port: 18888
  app-id: 1
  token: SAI_566a6bfbc26e4998b4841cc927d50c5d
  port: 3${server.port}
  skill-temp-dir: /tmp/snail-ai-agent/skills
  chat.ui.embed:
    enabled: true
    show-header: false
    show-sidebar-user: false

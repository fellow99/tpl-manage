    chat-timeout-ms: 300000

--- # 日志级别
logging:
  level:
    org.fellow99.tpl: DEBUG
    org.dromara: INFO
    org.springframework: WARN

--- # MyBatis Plus SQL 日志配置
mybatis-plus:
  sql-log:
    enabled: true
    output: console

--- # 数据源配置 (PostgreSQL)
spring:
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    dynamic:
      primary: master
      strict: true
      datasource:
        master:
          type: ${spring.datasource.type}
          driverClassName: org.postgresql.Driver
          url: ${DB_URL:}
          username: ${DB_USERNAME:}
          password: ${DB_PASSWORD:}
      hikari:
        maxPoolSize: 20
        minIdle: 10
        connectionTimeout: 30000
        validationTimeout: 5000
        idleTimeout: 600000
        maxLifetime: 1800000
        keepaliveTime: 30000

--- # Redis 单机配置
spring.data:
  redis:
    host: ${REDIS_HOST:}
    port: ${REDIS_PORT:}
    database: 0
    password: ${REDIS_PASSWORD:}
    timeout: 10s
    ssl.enabled: false

# Redisson 配置
redisson:
  keyPrefix:
  threads: 4
  nettyThreads: 8
  singleServerConfig:
    clientName: tpl-manage
    connectionMinimumIdleSize: 8
    connectionPoolSize: 32
    idleConnectionTimeout: 10000
    timeout: 3000
    subscriptionConnectionPoolSize: 50

--- # MinIO 文件存储配置
minio:
  endpoint: http://localhost:9000
  accessKey: minioadmin
  secretKey: ${MINIO_SECRET_KEY:}
  bucketName: tpl-manage

--- # mail 邮件发送
mail:
  enabled: false
  host: smtp.163.com
  port: 465
  auth: true
  from: xxx@163.com
  user: xxx@163.com
  pass: xxxxxxxxxx
  starttlsEnable: true
  sslEnable: true
  timeout: 0
  connectionTimeout: 0

--- # sms 短信
sms:
  config-type: yaml
  restricted: true
  minute-max: 1
  account-max: 30
  blends:
    config1:
      supplier: alibaba
      access-key-id: 您的accessKey
      access-key-secret: 您的accessKeySecret
      signature: 您的短信签名
      sdk-app-id: 您的sdkAppId
    config2:
      supplier: tencent
      access-key-id: 您的accessKey
      access-key-secret: 您的accessKeySecret
      signature: 您的短信签名
      sdk-app-id: 您的sdkAppId

